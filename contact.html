<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f3f5f2" />
        <title>Contact | Little Notes</title>
        <link rel="stylesheet" href="contact.css" />
        <script type="module" src="js/contact.js"></script>
    </head>
    <body>
        <main class="contact-page">
            <a class="back-link" href="index.html">← Back to To-Do List</a>

            <header class="page-heading">
                <p class="eyebrow">Task 13.3 · Session storage</p>
                <h1>Get in touch<span>.</span></h1>
                <p>Your unfinished message is saved in this tab while you type.</p>
            </header>

            <form id="contact-form" class="contact-form">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required />

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" maxlength="2000" required></textarea>

                <button type="submit">Submit demo form</button>
                <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </main>
    </body>
</html>
