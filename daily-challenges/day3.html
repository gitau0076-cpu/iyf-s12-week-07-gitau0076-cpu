<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Day 3: Form Auto-Save</title>
        <link rel="stylesheet" href="day3.css" />
        <script type="module" src="day3.js"></script>
    </head>
    <body>
        <main class="form-card">
            <p class="eyebrow">Daily Challenge · Day 3</p>
            <h1>Contact Form</h1>
            <p class="intro">Your draft saves every five seconds and returns if you refresh.</p>

            <form id="contact-form">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required />

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />

                <label for="topic">Topic</label>
                <select id="topic" name="topic" required>
                    <option value="">Choose a topic</option>
                    <option value="question">General question</option>
                    <option value="feedback">Feedback</option>
                    <option value="support">Support</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit</button>
            </form>

            <p id="save-status" class="status" role="status" aria-live="polite">
                Draft autosaves every five seconds.
            </p>
        </main>
    </body>
</html>
