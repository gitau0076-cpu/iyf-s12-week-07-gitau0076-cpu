<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>Day 1: Theme Persistence</title>
        <link rel="stylesheet" href="day1.css" />
        <script type="module" src="day1.js"></script>
    </head>
    <body>
        <main class="theme-card">
            <p class="eyebrow">Daily Challenge · Day 1</p>
            <h1>Theme Persistence</h1>
            <p class="intro">Choose a theme. Your preference will be remembered the next time you visit.</p>

            <button id="theme-toggle" type="button" aria-pressed="false">
                Switch to dark mode
            </button>
            <p id="theme-status" class="status" role="status" aria-live="polite"></p>
        </main>
    </body>
</html>
